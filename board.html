<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leetphus 白板</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#ffffff; --fg:#1f1e1c; --mute:#6f6b66; --line:#e6e2dc;
    --accent:#c96442; --accent-fg:#ffffff; --code:#f3f1ee; --err:#b3261e; --ok:#2f8f4e; --gutter:#a8a39c;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1f1e1d; --panel:#262624; --fg:#ecebe8; --mute:#a19d97; --line:#3a3936;
    --accent:#d97757; --accent-fg:#ffffff; --code:#171716; --err:#ff8a80; --ok:#5cc07a; --gutter:#6b6863;
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:600;white-space:nowrap}
  .brand span{color:var(--mute);font-weight:400}
  #name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
  #saved{font-size:12px;color:var(--mute);white-space:nowrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 12px;font-size:13px}
  button:hover{border-color:var(--mute)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #run{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
  #run:disabled{opacity:.6;cursor:default}
  kbd{font:11px ui-monospace,Menlo,monospace;opacity:.8;margin-left:6px}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,38%) 1fr}
  #desc{overflow-y:auto;padding:16px 20px;border-right:1px solid var(--line);font-size:14px}
  #desc h1{font-size:17px;margin:0 0 4px}
  #desc .meta{color:var(--mute);font-size:12px;margin-bottom:12px}
  #desc pre{background:var(--code);border-radius:6px;padding:8px 10px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace}
  #desc code{font:12.5px ui-monospace,Menlo,monospace;background:var(--code);padding:1px 4px;border-radius:4px}
  #desc pre code{padding:0;background:none}
  #desc img{max-width:100%;height:auto}
  #desc.hidden{display:none}
  main.nodesc{grid-template-columns:1fr}

  #right{display:flex;flex-direction:column;min-width:0;min-height:0}
  #editorWrap{flex:1;min-height:0;display:flex;background:var(--panel);overflow:hidden}
  #gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--gutter);user-select:none;font:13.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre;overflow:hidden}
  #code{flex:1;border:0;resize:none;padding:12px 12px 40vh 4px;background:transparent;color:var(--fg);font:13.5px/1.55 ui-monospace,Menlo,monospace;tab-size:4;white-space:pre;overflow:auto;outline:none}
  #outWrap{height:34%;min-height:90px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
  #outBar{display:flex;gap:10px;align-items:center;padding:5px 14px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
  #outBar .ok{color:var(--ok)}#outBar .bad{color:var(--err)}
  #out{flex:1;overflow:auto;margin:0;padding:10px 14px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  #out .err{color:var(--err)}
  #out .hint{color:var(--mute);font-family:inherit}

  /* 没有题目名时：选一道或新建 */
  #pick{flex:1;overflow-y:auto;padding:40px 16px;display:none}
  #pick .box{max-width:520px;margin:0 auto}
  #pick input{font:14px ui-monospace,Menlo,monospace;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
  #pick ul{list-style:none;padding:0;margin:16px 0 0}
  #pick h3{font-size:13px;color:var(--mute);font-weight:500;margin:22px 0 0}
  #pick li a{display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
  #pick li a:hover{background:var(--panel)}
  #pick li .no{width:2.2em;text-align:right;color:var(--mute);font-size:12px;flex:none}
  #pick li .tt{flex:1;min-width:0}
  #pick li .d{font-size:12px;color:var(--mute);flex:none}
  #pick li .w{font-size:12px;color:var(--ok);flex:none;width:6em;text-align:right}
  @media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:40% 1fr}#desc{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand">Leetphus <span>白板</span></div>
  <div id="name"></div>
  <div id="saved"></div>
  <button id="toggleDesc" title="收起 / 展开题面">题面</button>
  <button id="run" title="运行整份代码（⌘' 或 ⌘↵）">运行<kbd>⌘'</kbd></button>
</header>
<main id="main">
  <section id="desc"></section>
  <section id="right">
    <div id="editorWrap"><div id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="代码"></textarea></div>
    <div id="outWrap">
      <div id="outBar"><span>输出</span><span id="outMeta"></span></div>
      <pre id="out"><span class="hint">点「运行」或按 ⌘' 运行整份代码（和力扣一样）。没有判题，自己在 if __name__ == "__main__": 里调用、print 看结果。</span></pre>
    </div>
  </section>
</main>
<div id="pick"><div class="box">
  <h2 style="margin:0 0 6px">开一块白板</h2>
  <div style="color:var(--mute);font-size:13px;margin-bottom:12px">点下面的题，或者粘一个力扣题目链接 / slug 回车。随便起个名字也行，就没有题面。</div>
  <input id="newName" placeholder="力扣链接、slug，或者自己起的名字，回车打开">
  <div id="mine"></div>
  <h3>CodeTop 前 100（按频度）</h3>
  <ul id="recent"></ul>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
const PREVIEW = location.protocol === "file:"; // 直接双击打开 = 看样子，用示例数据
const name = PREVIEW ? "minimum-size-subarray-sum" : decodeURIComponent(location.pathname.replace(/^\/board\/?/, "").replace(/\/$/, ""));

// ---------- 编辑器：纯文本框，只做缩进，不做补全 ----------
const ta = $("#code"), gutter = $("#gutter");
function renderGutter() {
  const n = ta.value.split("\n").length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
}
ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
function edit(text, selStart, selEnd) {
  // 用 execCommand 插入，撤销（⌘Z）才能用
  ta.setSelectionRange(selStart, selEnd);
  document.execCommand("insertText", false, text);
}
ta.addEventListener("keydown", (e) => {
  const { selectionStart: s, selectionEnd: t, value: v } = ta;
  // 和力扣一样 ⌘' 运行；⌘↵ 在力扣是提交，白板没有提交，也当运行
  if ((e.metaKey || e.ctrlKey) && (e.key === "'" || e.key === "Enter")) { e.preventDefault(); run(); return; }
  if (e.key === "Tab") {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    if (s === t && !e.shiftKey) return edit("    ", s, t);
    // 多行：整段缩进 / 反缩进
    const le = v.indexOf("\n", t - (t > s && v[t - 1] === "\n" ? 1 : 0));
    const end = le < 0 ? v.length : le;
    const lines = v.slice(ls, end).split("\n");
    const out = lines.map((l) => (e.shiftKey ? l.replace(/^ {1,4}/, "") : "    " + l)).join("\n");
    edit(out, ls, end);
    ta.setSelectionRange(ls, ls + out.length);
    return;
  }
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    const line = v.slice(ls, s);
    let indent = line.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(line)) indent += "    ";
    edit("\n" + indent, s, t);
    return;
  }
  if (e.key === "Backspace" && s === t) {
    // 在行首空白里退格，一次退 4 格
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    const before = v.slice(ls, s);
    if (before.length && /^ +$/.test(before)) {
      e.preventDefault();
      const k = before.length % 4 || 4;
      edit("", s - k, s);
    }
  }
});

// ---------- 保存 ----------
let saveTimer = null;
ta.addEventListener("input", () => {
  renderGutter();
  $("#saved").textContent = "未保存";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
});
async function save() {
  if (PREVIEW) { $("#saved").textContent = "预览，不保存"; return; }
  try {
    const r = await fetch("/board-save", { method: "POST", body: JSON.stringify({ name, code: ta.value }) });
    $("#saved").textContent = r.ok ? "已保存" : "保存失败";
  } catch (_) { $("#saved").textContent = "连不上本地服务"; }
}

// ---------- 运行 ----------
let lastRun = null;
async function run() {
  $("#run").disabled = true;
  $("#outMeta").textContent = "运行中…";
  try {
    let r;
    if (PREVIEW) r = SAMPLE_RUN;
    else {
      clearTimeout(saveTimer);
      const res = await fetch("/board-run", { method: "POST", body: JSON.stringify({ name, code: ta.value }) });
      if (!res.ok) throw new Error(await res.text());
      r = await res.json();
      $("#saved").textContent = "已保存";
    }
    lastRun = { ...r, source: ta.value }; // code 是退出码，source 是运行时的代码
    showRun(r);
    // 告诉插件：有新的运行结果（侧边栏据此刷新、存历史）
    window.postMessage({ source: "leetphus-board", type: "run" }, "*");
  } catch (e) {
    $("#outMeta").textContent = "";
    $("#out").innerHTML = `<span class="err">${esc(String(e.message || e))}</span>`;
  } finally { $("#run").disabled = false; }
}
function showRun(r) {
  const ok = !r.timeout && r.code === 0;
  $("#outMeta").innerHTML = `<span class="${ok ? "ok" : "bad"}">${r.timeout ? "超时（10 秒）" : ok ? "运行结束" : "退出码 " + r.code}</span> · ${r.ms} ms`;
  const parts = [];
  if (r.stdout) parts.push(esc(r.stdout));
  if (r.stderr) parts.push(`<span class="err">${esc(r.stderr)}</span>`);
  $("#out").innerHTML = parts.join("\n") || '<span class="hint">（没有输出。记得 print）</span>';
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// 给插件读的：当前代码、题目、最近一次运行
window.addEventListener("message", (e) => {
  if (e.source !== window || e.data?.source !== "leetphus-board-ext" || e.data.type !== "get") return;
  window.postMessage({ source: "leetphus-board", type: "state", reqId: e.data.reqId,
    state: { name, title: document.title, code: ta.value, run: lastRun, question: questionText } }, "*");
});

// ---------- 题面 ----------
let questionText = "";
async function loadDesc() {
  let q = null;
  if (PREVIEW) q = SAMPLE_Q;
  else try { const r = await fetch("/board-question/" + encodeURIComponent(name)); if (r.ok) q = await r.json(); } catch (_) {}
  if (!q || !q.content) {
    $("#desc").classList.add("hidden"); $("#main").classList.add("nodesc");
    document.title = `白板：${name}`;
    return;
  }
  const title = `${q.id}. ${q.title}`;
  document.title = `白板：${title}`;
  $("#name").textContent = title;
  $("#desc").innerHTML = `<h1>${esc(title)}</h1><div class="meta">${esc(q.difficulty || "")} · <a href="https://leetcode.cn/problems/${encodeURIComponent(name)}/" target="_blank" rel="noreferrer">在力扣打开</a></div>${q.content}`;
  questionText = $("#desc").innerText;
}
$("#toggleDesc").onclick = () => { $("#desc").classList.toggle("hidden"); $("#main").classList.toggle("nodesc"); };

// ---------- 启动 ----------
async function init() {
  if (!name && !PREVIEW) {
    $("#main").style.display = "none"; $("#pick").style.display = "block";
    $("#run").style.display = $("#toggleDesc").style.display = "none";
    $("#newName").addEventListener("keydown", (e) => {
      const v = e.target.value.trim().replace(/^.*\/problems\/([^/?#]+).*$/, "$1"); // 也可以直接粘力扣链接
      if (e.key === "Enter" && v) location.href = "/board/" + encodeURIComponent(v);
    });
    const when = (t) => t ? new Date(t * 1000).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }) + " 写过" : "";
    try {
      const [{ list: probs }, { list: files }] = await Promise.all([
        fetch("/board-problems").then((r) => r.json()), fetch("/board-list").then((r) => r.json())]);
      $("#recent").innerHTML = probs.map((q) => `<li><a href="/board/${encodeURIComponent(q.slug)}"><span class="no">${q.rank}</span><span class="tt">${esc(q.id)}. ${esc(q.title)}</span><span class="d">${q.difficulty}</span><span class="w">${when(q.mtime)}</span></a></li>`).join("");
      const known = new Set(probs.map((q) => q.slug));
      const others = files.filter((f) => !known.has(f.name));
      if (others.length) $("#mine").innerHTML = `<h3>其他写过的</h3><ul>` + others.map((f) => `<li><a href="/board/${encodeURIComponent(f.name)}"><span class="tt">${esc(f.name)}</span><span class="w">${when(f.mtime)}</span></a></li>`).join("") + "</ul>";
    } catch (_) {}
    $("#newName").focus();
    return;
  }
  $("#name").textContent = name;
  if (PREVIEW) ta.value = SAMPLE_CODE;
  else try { ta.value = await (await fetch("/board-code/" + encodeURIComponent(name))).text(); } catch (_) {}
  renderGutter();
  loadDesc();
  if (PREVIEW) { $("#saved").textContent = "预览"; showRun(SAMPLE_RUN); }
  ta.focus();
}

// ---------- 预览用的示例数据（只在直接打开文件时用） ----------
const SAMPLE_Q = { id: "209", title: "长度最小的子数组", difficulty: "MEDIUM", content:
  `<p>给定一个含有 <code>n</code> 个正整数的数组和一个正整数 <code>target</code> 。</p><p>找出该数组中满足其总和大于等于 <code>target</code> 的长度最小的 <strong>子数组</strong> <code>[nums<sub>l</sub>, nums<sub>l+1</sub>, ..., nums<sub>r-1</sub>, nums<sub>r</sub>]</code> ，并返回其长度<strong>。</strong>如果不存在符合条件的子数组，返回 <code>0</code> 。</p><p><strong>示例 1：</strong></p><pre><strong>输入：</strong>target = 7, nums = [2,3,1,2,4,3]\n<strong>输出：</strong>2\n<strong>解释：</strong>子数组 [4,3] 是该条件下的长度最小的子数组。</pre><p><strong>示例 2：</strong></p><pre><strong>输入：</strong>target = 4, nums = [1,4,4]\n<strong>输出：</strong>1</pre><p><strong>示例 3：</strong></p><pre><strong>输入：</strong>target = 11, nums = [1,1,1,1,1,1,1,1]\n<strong>输出：</strong>0</pre><p><strong>提示：</strong></p><ul><li><code>1 &lt;= target &lt;= 10<sup>9</sup></code></li><li><code>1 &lt;= nums.length &lt;= 10<sup>5</sup></code></li><li><code>1 &lt;= nums[i] &lt;= 10<sup>4</sup></code></li></ul>` };
const SAMPLE_CODE = `def min_sub_array_len(target, nums):
    l = 0
    s = 0
    ans = float("inf")
    for r, x in enumerate(nums):
        s += x
        while s >= target:
            ans = min(ans, r - l + 1)
            s -= nums[l]
            l += 1
    return 0 if ans == float("inf") else ans


if __name__ == "__main__":
    print(min_sub_array_len(7, [2, 3, 1, 2, 4, 3]))   # 2
    print(min_sub_array_len(4, [1, 4, 4]))            # 1
    print(min_sub_array_len(11, [1] * 8))             # 0
`;
const SAMPLE_RUN = { stdout: "2\n1\n0\n", stderr: "", code: 0, timeout: false, ms: 31 };
init();
</script>
</body>
</html>
