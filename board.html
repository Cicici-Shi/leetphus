<title>Leetphus 白板</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#ffffff; --fg:#1f1e1c; --mute:#6f6b66; --line:#e6e2dc;
    --accent:#c96442; --accent-fg:#ffffff; --code:#f3f1ee; --err:#b3261e; --ok:#2f8f4e; --gutter:#a8a39c;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1f1e1d; --panel:#262624; --fg:#ecebe8; --mute:#a19d97; --line:#3a3936;
    --accent:#d97757; --accent-fg:#ffffff; --code:#171716; --err:#ff8a80; --ok:#5cc07a; --gutter:#6b6863;
    color-scheme:dark;
  }}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:600;white-space:nowrap}
  .brand span{color:var(--mute);font-weight:400}
  #name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
  #saved{font-size:12px;color:var(--mute);white-space:nowrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 12px;font-size:13px}
  button:hover{border-color:var(--mute)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #run{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
  #run:disabled,#submit:disabled{opacity:.6;cursor:default}
  #submit.on{display:inline-block}
  #submit{display:none;border-color:var(--ok);color:var(--ok);font-weight:600}
  #reviewLab.ok{color:var(--ok)}#reviewLab.bad{color:var(--err)}#reviewLab.done{color:var(--fg)}
  kbd{font:11px ui-monospace,Menlo,monospace;opacity:.8;margin-left:6px}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,38%) 1fr}
  #desc{overflow-y:auto;padding:16px 20px;border-right:1px solid var(--line);font-size:14px}
  #desc h1{font-size:17px;margin:0 0 4px}
  #desc .meta{color:var(--mute);font-size:12px;margin-bottom:12px}
  #desc pre{background:var(--code);border-radius:6px;padding:8px 10px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace}
  #desc code{font:12.5px ui-monospace,Menlo,monospace;background:var(--code);padding:1px 4px;border-radius:4px}
  #desc pre code{padding:0;background:none}
  #desc img{max-width:100%;height:auto}
  #desc.hidden{display:none}
  main.nodesc{grid-template-columns:1fr}

  #right{display:flex;flex-direction:column;min-width:0;min-height:0}
  #editorWrap{flex:1;min-height:0;display:flex;background:var(--panel);overflow:hidden}
  #gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--gutter);user-select:none;font:13.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre;overflow:hidden}
  #code{flex:1;border:0;resize:none;padding:12px 12px 40vh 4px;background:transparent;color:var(--fg);font:13.5px/1.55 ui-monospace,Menlo,monospace;tab-size:4;white-space:pre;overflow:auto;outline:none}
  #outWrap{height:34%;min-height:90px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
  #outBar{display:flex;gap:10px;align-items:center;padding:5px 14px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
  #outMeta{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #outBar .ok{color:var(--ok)}#outBar .bad{color:var(--err)}
  #out{flex:1;overflow:auto;margin:0;padding:10px 14px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
  #out .err{color:var(--err)}
  #out .hint{color:var(--mute);font-family:inherit}

  /* 没有题目名时：选一道或新建 */
  #pick{flex:1;overflow-y:auto;padding:40px 16px;display:none}
  #pick .box{max-width:520px;margin:0 auto}
  #pick input{font:14px ui-monospace,Menlo,monospace;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
  #pick ul{list-style:none;padding:0;margin:16px 0 0}
  #pick h3{font-size:13px;color:var(--mute);font-weight:500;margin:22px 0 0}
  #pick li a{display:flex;gap:10px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
  #pick li a:hover{background:var(--panel)}
  #pick li .no{width:2.2em;text-align:right;color:var(--mute);font-size:12px;flex:none}
  #pick li .tt{flex:1;min-width:0}
  #pick li .d{font-size:12px;color:var(--mute);flex:none}
  #pick li .w{font-size:12px;color:var(--ok);flex:none;width:6em;text-align:right}
  /* 计时、提示、口述 */
  #clock{font:12px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap}
  #clock.long{color:var(--accent)}
  #hint.used{border-color:var(--accent);color:var(--accent)}
  #note{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28em}
  #talk{display:none;flex-direction:column;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  #talk.on{display:flex}
  #talk textarea{font:13px/1.6 inherit;font-family:inherit;min-height:84px;max-height:30vh;resize:vertical;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
  #talk .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
  #talk .row span{flex:1}
  #reviewBar button.sug{outline:2px solid currentColor;outline-offset:1px;font-weight:600}
  /* 复习 */
  .g{display:inline-block;width:1.4em;text-align:center;border-radius:4px;font-size:12px;flex:none;color:#fff}
  .g.red{background:#c0392b}.g.yellow{background:#c9a227}.g.green{background:var(--ok)}
  #pick li .od{font-size:12px;color:var(--mute);flex:none;text-align:right}
  #pick li .od.late{color:var(--err)}
  #pick details summary{cursor:pointer;font-size:13px;color:var(--mute);margin-top:22px}
  #pick .tip{font-size:12px;color:var(--mute);margin:4px 0 0}
  #reviewBar{display:none;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px}
  #reviewBar .lab{flex:1;min-width:0;color:var(--mute)}
  #reviewBar button.red{border-color:#c0392b;color:#c0392b}
  #reviewBar button.yellow{border-color:#c9a227;color:#a5841c}
  #reviewBar button.green{border-color:var(--ok);color:var(--ok)}
  @media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:40% 1fr}#desc{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand">Leetphus <span>白板</span></div>
  <div id="name"></div>
  <div id="saved"></div>
  <div id="note" role="status"></div>
  <div id="clock" title="从打开这块白板开始计时"></div>
  <button id="hint" title="按档位要提示：题型 → 关键观察 → 伪代码 → 完整代码，每次只多给一档（在侧边栏回答）">要提示 0/4</button>
  <button id="talkBtn" title="动手前先把思路讲一遍，侧边栏当面试官点评">口述</button>
  <button id="toggleDesc" title="收起 / 展开题面">题面</button>
  <button id="run" title="在本地运行整份代码，不判题、不记分（⌘'）">运行<kbd>⌘'</kbd></button>
  <button id="submit" title="交给力扣判题，AC 了自动记复习颜色（⌘↵）">提交<kbd>⌘↵</kbd></button>
</header>
<div id="reviewBar"><span class="lab" id="reviewLab">写完点「提交」交给力扣判，AC 了自动记颜色；觉得颜色不对，点右边改这次的</span>
  <button class="green" data-g="green" title="没问侧边栏就写出来了（改这次的颜色）">绿 · 独立写出</button>
  <button class="yellow" data-g="yellow" title="问过侧边栏或看了提示（改这次的颜色）">黄 · 要了提示</button>
  <button class="red" data-g="red" title="看了答案才写出来（改这次的颜色）">红 · 看了答案</button>
</div>
<main id="main">
  <section id="desc"></section>
  <section id="right">
    <div id="talk">
      <textarea id="talkText" placeholder="动手前先讲一遍（可以用语音输入）：&#10;1. 澄清需求：输入输出、边界、规模&#10;2. 暴力解和它的复杂度&#10;3. 怎么优化，关键观察是什么&#10;4. 循环里一直成立的条件（不变式）&#10;5. 最终的时间、空间复杂度"></textarea>
      <div class="row"><span>讲完点右边，侧边栏会当面试官点评：只说你缺了哪步、问你一句，不给答案。</span><button id="talkSend">讲给面试官</button></div>
    </div>
    <div id="editorWrap"><div id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="代码"></textarea></div>
    <div id="outWrap">
      <div id="outBar"><span>输出</span><span id="outMeta"></span></div>
      <pre id="out"><span class="hint">点「运行」或按 ⌘' 在本地运行整份代码，不判题，直接在文件末尾写调用和 print 看结果。写完点「提交」或按 ⌘↵ 交给力扣判题（和力扣一样）。</span></pre>
    </div>
  </section>
</main>
<div id="pick"><div class="box">
  <h2 style="margin:0 0 6px">开一块白板</h2>
  <div style="color:var(--mute);font-size:13px;margin-bottom:12px">点下面的题，或者粘一个力扣题目链接 / slug 回车。随便起个名字也行，就没有题面。</div>
  <input id="newName" placeholder="力扣链接、slug，或者自己起的名字，回车打开">
  <div id="review"></div>
  <div id="mine"></div>
  <h3>CodeTop 前 100（按频度）</h3>
  <ul id="recent"></ul>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
const PREVIEW = location.protocol === "file:"; // 直接双击打开 = 看样子，用示例数据
const name = PREVIEW ? "minimum-size-subarray-sum" : decodeURIComponent(location.pathname.replace(/^\/board\/?/, "").replace(/\/$/, ""));

// ---------- 编辑器：纯文本框，只做缩进，不做补全 ----------
const ta = $("#code"), gutter = $("#gutter");
function renderGutter() {
  const n = ta.value.split("\n").length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
}
ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
function edit(text, selStart, selEnd) {
  // 用 execCommand 插入，撤销（⌘Z）才能用
  ta.setSelectionRange(selStart, selEnd);
  document.execCommand("insertText", false, text);
}
ta.addEventListener("keydown", (e) => {
  const { selectionStart: s, selectionEnd: t, value: v } = ta;
  // 和力扣一样：⌘' 运行，⌘↵ 提交
  if ((e.metaKey || e.ctrlKey) && e.key === "'") { e.preventDefault(); run(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); submit(); return; }
  if (e.key === "Tab") {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    if (s === t && !e.shiftKey) return edit("    ", s, t);
    // 多行：整段缩进 / 反缩进
    const le = v.indexOf("\n", t - (t > s && v[t - 1] === "\n" ? 1 : 0));
    const end = le < 0 ? v.length : le;
    const lines = v.slice(ls, end).split("\n");
    const out = lines.map((l) => (e.shiftKey ? l.replace(/^ {1,4}/, "") : "    " + l)).join("\n");
    edit(out, ls, end);
    ta.setSelectionRange(ls, ls + out.length);
    return;
  }
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    const line = v.slice(ls, s);
    let indent = line.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(line)) indent += "    ";
    edit("\n" + indent, s, t);
    return;
  }
  if (e.key === "Backspace" && s === t) {
    // 在行首空白里退格，一次退 4 格
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    const before = v.slice(ls, s);
    if (before.length && /^ +$/.test(before)) {
      e.preventDefault();
      const k = before.length % 4 || 4;
      edit("", s - k, s);
    }
  }
});

// ---------- 保存 ----------
let saveTimer = null;
ta.addEventListener("input", () => {
  renderGutter();
  $("#saved").textContent = "未保存";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
});
async function save() {
  if (PREVIEW) { $("#saved").textContent = "预览，不保存"; return; }
  try {
    const r = await fetch("/board-save", { method: "POST", body: JSON.stringify({ name, code: ta.value }) });
    $("#saved").textContent = r.ok ? "已保存" : "保存失败";
  } catch (_) { $("#saved").textContent = "连不上本地服务"; }
}

// ---------- 运行 ----------
let lastRun = null;
async function run() {
  $("#run").disabled = true;
  $("#outMeta").textContent = "运行中…";
  $("#out").innerHTML = '<span class="hint">运行中…</span>'; // 先清掉上一次的输出，免得以为卡住了
  try {
    let r;
    if (PREVIEW) r = SAMPLE_RUN;
    else {
      clearTimeout(saveTimer);
      const res = await fetch("/board-run", { method: "POST", body: JSON.stringify({ name, code: ta.value }) });
      if (!res.ok) throw new Error(await res.text());
      r = await res.json();
      $("#saved").textContent = "已保存";
    }
    lastRun = { ...r, source: ta.value }; // code 是退出码，source 是运行时的代码
    showRun(r);
    // 告诉插件：有新的运行结果（侧边栏据此刷新、存历史）
    window.postMessage({ source: "leetphus-board", type: "run" }, "*");
  } catch (e) {
    $("#outMeta").textContent = "";
    $("#out").innerHTML = `<span class="err">${esc(String(e.message || e))}</span>`;
  } finally { $("#run").disabled = false; }
}
function showRun(r) {
  const ok = !r.timeout && r.code === 0;
  // 报错时把最后一行（异常类型和信息）放到标题栏，不用往下翻
  const errLine = !ok && r.stderr ? r.stderr.trim().split("\n").pop() : "";
  $("#outMeta").innerHTML = `<span class="${ok ? "ok" : "bad"}">${r.timeout ? "超时（10 秒）" : ok ? "运行结束" : "退出码 " + r.code}</span> · ${r.ms} ms` +
    (errLine ? ` · <span class="bad">${esc(errLine)}</span>` : "");
  const parts = [];
  if (r.stdout) parts.push(esc(r.stdout));
  if (r.stderr) parts.push(`<span class="err">${esc(r.stderr)}</span>`);
  $("#out").innerHTML = parts.join("\n") || '<span class="hint">（没有输出。记得 print）</span>';
  // 有报错就滚到底（Traceback 的结论在最后一行），否则从头看输出
  $("#out").scrollTop = r.stderr ? $("#out").scrollHeight : 0;
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// 给插件读的：当前代码、题目、最近一次运行
window.addEventListener("message", (e) => {
  if (e.source !== window || e.data?.source !== "leetphus-board-ext" || e.data.type !== "get") return;
  window.postMessage({ source: "leetphus-board", type: "state", reqId: e.data.reqId,
    state: { name, title: document.title, code: ta.value, run: lastRun, judge: lastJudge, question: questionText } }, "*");
});

// ---------- 题面 ----------
let questionText = "";
async function loadDesc() {
  let q = null;
  if (PREVIEW) q = SAMPLE_Q;
  else try { const r = await fetch("/board-question/" + encodeURIComponent(name)); if (r.ok) q = await r.json(); } catch (_) {}
  if (!q || !q.content) {
    $("#desc").classList.add("hidden"); $("#main").classList.add("nodesc");
    document.title = `白板：${name}`;
    return;
  }
  const title = `${q.id}. ${q.title}`;
  document.title = `白板：${title}`;
  $("#name").textContent = title;
  $("#desc").innerHTML = `<h1>${esc(title)}</h1><div class="meta">${esc(q.difficulty || "")} · <a href="https://leetcode.cn/problems/${encodeURIComponent(name)}/" target="_blank" rel="noreferrer">在力扣打开</a></div>${q.content}`;
  questionText = $("#desc").innerText;
  // 有题面 = 是力扣题：能提交、能记颜色
  canJudge = true;
  $("#submit").classList.add("on"); // 清空内联样式会落回 CSS 的 display:none，所以用 class
  $("#reviewBar").style.display = "flex";
  if (!PREVIEW) try { const r = await fetch("/board-judge/" + encodeURIComponent(name)); if (r.ok) showJudge(await r.json(), true); } catch (_) {}
}
$("#run").onclick = run;
$("#submit").onclick = () => submit();
$("#toggleDesc").onclick = () => { $("#desc").classList.toggle("hidden"); $("#main").classList.toggle("nodesc"); };

// ---------- 启动 ----------
async function init() {
  if (!name && !PREVIEW) {
    $("#main").style.display = "none"; $("#pick").style.display = "block";
    for (const id of ["#run", "#toggleDesc", "#hint", "#talkBtn"]) $(id).style.display = "none";
    $("#newName").addEventListener("keydown", (e) => {
      const v = e.target.value.trim().replace(/^.*\/problems\/([^/?#]+).*$/, "$1"); // 也可以直接粘力扣链接
      if (e.key === "Enter" && v) location.href = "/board/" + encodeURIComponent(v);
    });
    const when = (t) => t ? new Date(t * 1000).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }) + " 写过" : "";
    try {
      const [{ list: probs }, { list: files }] = await Promise.all([
        fetch("/board-problems").then((r) => r.json()), fetch("/board-list").then((r) => r.json())]);
      $("#recent").innerHTML = probs.map((q) => `<li><a href="/board/${encodeURIComponent(q.slug)}"><span class="no">${q.rank}</span><span class="tt">${esc(q.id)}. ${esc(q.title)}</span><span class="d">${q.difficulty}</span><span class="w">${when(q.mtime)}</span></a></li>`).join("");
      const known = new Set(probs.map((q) => q.slug));
      const others = files.filter((f) => !known.has(f.name));
      if (others.length) $("#mine").innerHTML = `<h3>其他写过的</h3><ul>` + others.map((f) => `<li><a href="/board/${encodeURIComponent(f.name)}"><span class="tt">${esc(f.name)}</span><span class="w">${when(f.mtime)}</span></a></li>`).join("") + "</ul>";
    } catch (_) {}
    loadReview();
    $("#newName").focus();
    return;
  }
  $("#name").textContent = name;
  // 打分条和「提交」在拿到题面后才显示（loadDesc）
  if (new URLSearchParams(location.search).has("review")) {
    $("#talk").classList.add("on"); // 模拟面试：先讲再写
    // 只在刚从复习栏点进来时清空一次；之后地址改成 review=on，刷新不会把写到一半的代码挪走
    if (new URLSearchParams(location.search).get("review") === "1" && !PREVIEW) {
      try { await fetch("/board-fresh", { method: "POST", body: JSON.stringify({ name }) }); } catch (_) {}
      history.replaceState(null, "", location.pathname + "?review=on");
      store.del("hint"); store.del("start");
    }
  }
  if (PREVIEW) ta.value = SAMPLE_CODE;
  else try { ta.value = await (await fetch("/board-code/" + encodeURIComponent(name))).text(); } catch (_) {}
  renderGutter();
  loadDesc();
  startClock(); showHint();
  if (PREVIEW) { $("#saved").textContent = "预览"; showRun(SAMPLE_RUN); }
  ta.focus();
}

// ---------- 每块白板自己的计时和提示档位（存在本标签页，刷新不丢） ----------
const store = {
  get: (k) => { try { return sessionStorage.getItem(k + ":" + name); } catch (_) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k + ":" + name, v); } catch (_) {} },
  del: (k) => { try { sessionStorage.removeItem(k + ":" + name); } catch (_) {} },
};
function startClock() {
  let t0 = +store.get("start");
  if (!t0) { t0 = Date.now(); store.set("start", t0); }
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    // 推文的建议：先自己卡 15 分钟，再按档要提示
    $("#clock").classList.toggle("long", s >= 15 * 60);
    $("#clock").title = s >= 15 * 60 ? "已经 15 分钟了：卡住的话可以要一档提示" : "从打开这块白板开始计时";
  };
  tick(); setInterval(tick, 1000);
}

// 白板上的按钮请侧边栏代问；侧边栏没开就接不了
function askPanel(text, label) {
  return new Promise((resolve) => {
    const reqId = Math.random().toString(36).slice(2);
    const on = (e) => {
      if (e.source !== window || e.data?.source !== "leetphus-board-ext" || e.data.type !== "askResult" || e.data.reqId !== reqId) return;
      window.removeEventListener("message", on); clearTimeout(timer); resolve(e.data);
    };
    const timer = setTimeout(() => { window.removeEventListener("message", on); resolve({ taken: false, why: "noext" }); }, 2000);
    window.addEventListener("message", on);
    window.postMessage({ source: "leetphus-board", type: "ask", reqId, text, label }, "*");
  });
}
const WHY = {
  closed: "侧边栏没开：按 Alt+Shift+L 打开再点",
  noext: "插件没响应：在 chrome://extensions 里重新加载 Leetphus，再刷新这页",
  busy: "侧边栏正在回答，等它说完再点",
  hidden: "侧边栏停在题单/偏好页，切回对话再点",
  other: "侧边栏看的不是这块白板：先点一下这个标签页",
};
let noteTimer = null;
function note(msg) { $("#note").textContent = msg; $("#note").title = msg; clearTimeout(noteTimer); noteTimer = setTimeout(() => { $("#note").textContent = ""; }, 8000); }

// ---------- 提示四档 ----------
const HINTS = [
  ["题型", "只用一句话告诉我这题属于什么题型、往哪个大方向想（比如「滑动窗口」「树的后序遍历」），不要说具体怎么做。"],
  ["关键观察", "给我解这题最关键的一个观察，一两句话，不要给步骤，不要给代码。"],
  ["伪代码", "给我半伪代码：保留 for / while / if 的结构和变量名（尽量用我白板里已经起的名字），细节写成大白话；不要给能直接运行的代码。"],
  ["完整题解", "给完整代码，并用一个小例子讲清楚。"],
];
const hintLevel = () => +store.get("hint") || 0;
function showHint() {
  const n = hintLevel();
  $("#hint").textContent = n >= HINTS.length ? "提示用完了" : `要提示 ${n}/${HINTS.length}`;
  $("#hint").title = n >= HINTS.length ? "四档都给过了" : `下一档：${HINTS[n][0]}`;
  $("#hint").classList.toggle("used", n > 0);
  // 复习打分条：按用到的档位标出建议等级（0 档绿，1～3 档黄，看了完整题解红）
  const sug = n === 0 ? "green" : n >= HINTS.length ? "red" : "yellow";
  document.querySelectorAll("#reviewBar button").forEach((b) => b.classList.toggle("sug", b.dataset.g === sug));
}
$("#hint").onclick = async () => {
  const n = hintLevel();
  if (n >= HINTS.length) return note("四档提示都给过了，往上翻侧边栏");
  const [tag, ask] = HINTS[n];
  const r = await askPanel(`【提示 ${n + 1}/${HINTS.length}：${tag}】我在白板上卡住了。${ask}只给这一档，别多说。`, `要提示 ${n + 1}/${HINTS.length}：${tag}`);
  if (!r.taken) return note(WHY[r.why] || WHY.closed);
  store.set("hint", n + 1); showHint();
};

// ---------- 口述 ----------
$("#talkBtn").onclick = () => { $("#talk").classList.toggle("on"); if ($("#talk").classList.contains("on")) $("#talkText").focus(); };
$("#talkSend").onclick = async () => {
  const t = $("#talkText").value.trim();
  if (!t) return note("先讲点什么");
  // 开头的标记让这条不算「要提示」（review.py 的 TALK_TAG）
  const r = await askPanel(`【模拟面试：口述思路】下面是我动手写代码前口述的思路（语音输入，可能有错字）。请你当面试官点评：按「澄清需求、暴力解、优化、不变式、复杂度」五步，逐步说我讲到没有、讲对没有；没讲到或讲错的，只指出缺了什么，再像面试官那样追问我一句。不要替我讲出答案，也不要给代码。\n\n我的口述：\n${t}`,
    `口述思路：${t.length > 40 ? t.slice(0, 40) + "…" : t}`);
  if (!r.taken) return note(WHY[r.why] || WHY.closed);
  note("已交给侧边栏，看右边的点评");
};

// ---------- 复习（红黄绿） ----------
const GN = { red: "红", yellow: "黄", green: "绿" };
const chip = (g) => `<span class="g ${g}" title="${{ red: "看了答案才写出", yellow: "要了提示", green: "独立写出" }[g]}">${GN[g]}</span>`;
const mmdd = (iso) => iso.slice(5).replace("-", "/").replace(/^0/, "");
async function loadReview() {
  let r;
  try { r = await (await fetch("/review")).json(); } catch (_) { return; }
  const link = (s) => `/board/${encodeURIComponent(s.slug)}?review=1`;
  const row = (s, right) => `<li><a href="${link(s)}">${chip(s.last)}<span class="tt">${esc(s.title)}</span>${right}</a></li>`;
  let h = "";
  if (r.due.length) h += `<h3>今天该复习（${r.due.length}）</h3><div class="tip">点进去是空白白板，凭记忆从头写；写完在顶上打分。颜色是上次的情况。</div><ul>` +
    r.due.map((s) => row(s, `<span class="od ${s.overdue ? "late" : ""}">${s.overdue ? `拖了 ${s.overdue} 天` : "今天"} · 第 ${s.step + 1}/${s.steps} 轮</span>`)).join("") + "</ul>";
  else h += `<h3>今天该复习</h3><div class="tip">今天没有要复习的。</div>`;
  if (r.unfinished.length) h += `<h3>没做完（${r.unfinished.length}）</h3><ul>` +
    r.unfinished.map((s) => `<li><a href="https://leetcode.cn/problems/${encodeURIComponent(s.slug)}/" target="_blank" rel="noreferrer"><span class="g" style="background:var(--gutter)">…</span><span class="tt">${esc(s.title)}</span><span class="od">问过还没 AC</span></a></li>`).join("") + "</ul>";
  if (r.upcoming.length) h += `<details><summary>接下来（${r.upcoming.length}）</summary><ul>` +
    r.upcoming.map((s) => row(s, `<span class="od">${mmdd(s.due)}</span>`)).join("") + "</ul></details>";
  if (r.done.length) h += `<details><summary>已掌握（${r.done.length}）</summary><ul>` +
    r.done.map((s) => row(s, `<span class="od">复习完了</span>`)).join("") + "</ul></details>";
  $("#review").innerHTML = h;
}
// 点颜色 = 改这次的颜色（1 小时内记过一次就改那次，没有就新记一次），见 review.py 的 override
document.querySelectorAll("#reviewBar button").forEach((b) => b.addEventListener("click", async () => {
  try {
    const r = await fetch("/review", { method: "POST", body: JSON.stringify({ slug: name, grade: b.dataset.g, override: true }) });
    const s = await r.json();
    lab(`已改成：${GN[b.dataset.g]}，${nextDue(s.due)}`, "done");
  } catch (_) { lab("没记上：连不上本地服务", "bad"); }
}));
const nextDue = (due) => due ? `下次 ${mmdd(due)} 复习` : "这道题复习完了";
function lab(text, cls = "") { $("#reviewLab").textContent = text; $("#reviewLab").title = text; $("#reviewLab").className = "lab " + cls; }

// ---------- 提交：交给力扣判题（judge.py），AC 了自动记颜色 ----------
let lastJudge = null, judging = false, canJudge = false;
const VERDICT = { wa: (r) => `提交没通过：${r.status_msg}`, tle: () => "超时（TLE）", re: () => "运行出错（Runtime Error）",
  ce: () => "编译出错（Compile Error）", other: (r) => `提交没通过：${r.status_msg}` };
async function submit() {
  if (judging) return note("正在判题，等它出结果");
  if (!canJudge) return note("判不出：这块白板的名字不是力扣题目，拿不到题面");
  judging = true;
  $("#submit").disabled = true;
  lab("判题中（力扣）…");
  $("#outMeta").textContent = "提交中，力扣判题…";
  $("#out").innerHTML = '<span class="hint">已交给力扣，通常十几秒出结果。</span>';
  try {
    let r;
    if (PREVIEW) r = SAMPLE_JUDGE;
    else {
      clearTimeout(saveTimer);
      await ensureCookies();
      const res = await fetch("/board-submit", { method: "POST", body: JSON.stringify({ name, code: ta.value }) });
      if (!res.ok) throw new Error(await res.text());
      r = await res.json();
      $("#saved").textContent = "已保存";
    }
    if (r.verdict !== "busy") lastJudge = { ...r, source: ta.value };
    showJudge(r);
    // 告诉插件：有新的提交结果（侧边栏刷新）
    window.postMessage({ source: "leetphus-board", type: "judge" }, "*");
  } catch (e) {
    lab("判不出：连不上本地服务（" + String(e.message || e) + "）", "bad");
  } finally { judging = false; $("#submit").disabled = false; }
}
// 让插件把力扣登录状态交给本地服务；插件没装或没响应就直接交，由服务端报「没拿到登录状态」
function ensureCookies() {
  return new Promise((resolve) => {
    const reqId = Math.random().toString(36).slice(2);
    const on = (e) => {
      if (e.source !== window || e.data?.source !== "leetphus-board-ext" || e.data.type !== "cookiesResult" || e.data.reqId !== reqId) return;
      window.removeEventListener("message", on); resolve(e.data.ok);
    };
    window.addEventListener("message", on);
    window.postMessage({ source: "leetphus-board", type: "cookies", reqId }, "*");
    setTimeout(() => { window.removeEventListener("message", on); resolve(false); }, 2000);
  });
}
// restored：刷新后从 /board-judge 恢复上一次的结果
function showJudge(r, restored = false) {
  if (restored) lastJudge = { ...r, source: null };
  const pre = restored ? "上次提交：" : r.dup ? "一小时内已交过同样的代码，没再交。上次：" : "";
  if (r.verdict === "busy") return lab("上一次提交还在判，等它出结果");
  if (r.verdict === "cant") {
    lab(pre + "判不出：" + r.reason, "bad");
    if (!restored) { $("#outMeta").innerHTML = '<span class="bad">没交上</span>'; $("#out").innerHTML = `<span class="err">判不出：${esc(r.reason)}</span>`; }
    return;
  }
  if (r.verdict === "accepted") {
    const v = r.review;
    if (!v) return lab(pre + "通过了（Accepted）", "ok");
    const said = `${GN[v.grade]}（${v.why}），${nextDue(v.due)}`;
    if (!restored) { $("#outMeta").innerHTML = '<span class="ok">力扣判题：Accepted</span>'; $("#out").innerHTML = `<span class="hint">通过了。${esc(said)}</span>`; }
    return lab(pre + (v.merged ? `通过了。一小时内已经记过一次，算同一次：${said}` : `通过了，已记：${said}`), "ok");
  }
  lab(pre + (VERDICT[r.verdict] || VERDICT.other)(r) + (r.total ? `，通过 ${r.passed ?? "?"} / ${r.total} 个用例` : ""), "bad");
  if (restored) return;
  // 出错的输入放到输出区：只给输入，不给预期输出和你的输出，自己找原因
  $("#outMeta").innerHTML = `<span class="bad">力扣判题：${esc(r.status_msg || "")}</span>`;
  const parts = [];
  if (r.input) parts.push(`<span class="hint">出错的输入（预期输出不给，自己在白板上跑一下找原因）：</span>\n${esc(r.input)}`);
  if (r.error) parts.push(`<span class="err">${esc(r.error)}</span>`);
  $("#out").innerHTML = parts.join("\n\n") || '<span class="hint">力扣没给出错的输入。</span>';
  $("#out").scrollTop = 0;
}

// ---------- 预览用的示例数据（只在直接打开文件时用） ----------
const SAMPLE_Q = { id: "209", title: "长度最小的子数组", difficulty: "MEDIUM", content:
  `<p>给定一个含有 <code>n</code> 个正整数的数组和一个正整数 <code>target</code> 。</p><p>找出该数组中满足其总和大于等于 <code>target</code> 的长度最小的 <strong>子数组</strong> <code>[nums<sub>l</sub>, nums<sub>l+1</sub>, ..., nums<sub>r-1</sub>, nums<sub>r</sub>]</code> ，并返回其长度<strong>。</strong>如果不存在符合条件的子数组，返回 <code>0</code> 。</p><p><strong>示例 1：</strong></p><pre><strong>输入：</strong>target = 7, nums = [2,3,1,2,4,3]\n<strong>输出：</strong>2\n<strong>解释：</strong>子数组 [4,3] 是该条件下的长度最小的子数组。</pre><p><strong>示例 2：</strong></p><pre><strong>输入：</strong>target = 4, nums = [1,4,4]\n<strong>输出：</strong>1</pre><p><strong>示例 3：</strong></p><pre><strong>输入：</strong>target = 11, nums = [1,1,1,1,1,1,1,1]\n<strong>输出：</strong>0</pre><p><strong>提示：</strong></p><ul><li><code>1 &lt;= target &lt;= 10<sup>9</sup></code></li><li><code>1 &lt;= nums.length &lt;= 10<sup>5</sup></code></li><li><code>1 &lt;= nums[i] &lt;= 10<sup>4</sup></code></li></ul>` };
const SAMPLE_CODE = `def min_sub_array_len(target, nums):
    l = 0
    s = 0
    ans = float("inf")
    for r, x in enumerate(nums):
        s += x
        while s >= target:
            ans = min(ans, r - l + 1)
            s -= nums[l]
            l += 1
    return 0 if ans == float("inf") else ans


print(min_sub_array_len(7, [2, 3, 1, 2, 4, 3]))   # 2
print(min_sub_array_len(4, [1, 4, 4]))            # 1
print(min_sub_array_len(11, [1] * 8))             # 0
`;
const SAMPLE_RUN = { stdout: "2\n1\n0\n", stderr: "", code: 0, timeout: false, ms: 31 };
const SAMPLE_JUDGE = { verdict: "wa", status_msg: "Wrong Answer", passed: 12, total: 21, input: "7\n[2,3,1,2,4,3]" };
init();
</script>
